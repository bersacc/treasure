<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Pendaftaran</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #00ffb3;
      margin-bottom: 20px;
      text-align: center;
    }

    form {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px #00ffb366;
      max-width: 400px;
      width: 100%;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 1em;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #00ffb3;
      color: #000;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00c78a;
    }

    #statusText {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Formulir Pendaftaran</h1>

  <form id="formPendaftaran">
    <label for="nama">Nama</label>
    <input type="text" id="nama" name="nama" required />

    <label for="platform">Platform Promosi</label>
    <input type="text" id="platform" name="platform" required />

    <label for="account">Account BA</label>
    <input type="text" id="account" name="account" required />

    <label for="whatsapp">Nomor WhatsApp</label>
    <input type="text" id="whatsapp" name="whatsapp" required />

    <button type="submit">Kirim</button>
  </form>

  <p id="statusText"></p>

  <script>
    const form = document.querySelector("#formPendaftaran");
    const statusText = document.getElementById("statusText");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        nama: form.nama.value,
        platform: form.platform.value,
        account: form.account.value,
        whatsapp: form.whatsapp.value
      };

      const button = form.querySelector("button[type='submit']");
      button.disabled = true;
      button.textContent = "Mengirim data...";
      statusText.textContent = "";

      try {
        const res = await fetch("/api", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const text = await res.text();
        let result;
        try {
          result = JSON.parse(text);
        } catch {
          throw new Error("Respon bukan JSON valid:\n" + text);
        }

        statusText.textContent = "✅ " + result.message;
        statusText.style.color = "lime";
        form.reset();

      } catch (err) {
        statusText.textContent = "❌ " + err.message;
        statusText.style.color = "red";
      } finally {
        button.disabled = false;
        button.textContent = "Kirim";
      }
    });
  </script>
</body>
</html>
