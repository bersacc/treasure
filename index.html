<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran BA</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #121212;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    form {
      background: #1e1e1e;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    input, select {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <form id="regForm">
    <h2>Formulir Pendaftaran BA</h2>
    <input type="text" name="nama" placeholder="Nama Lengkap" required>
    <select name="platform" required>
      <option value="">Pilih Platform Promosi</option>
      <option value="Instagram">Instagram</option>
      <option value="TikTok">TikTok</option>
      <option value="YouTube">YouTube</option>
      <option value="X (Twitter)">X (Twitter)</option>
    </select>
    <input type="text" name="account" placeholder="Username / Link Akun" required>
    <input type="tel" name="whatsapp" placeholder="Nomor WhatsApp" required>
    <label>Upload Bukti Kepemilikan Akun:</label>
    <input type="file" name="bukti" accept="image/*" required>
    <button type="submit">Kirim</button>
  </form>

  <script>
    const scriptURL = "PASTE_WEB_APP_URL_DI_SINI"; // URL dari Google Apps Script
    const form = document.getElementById("regForm");

    form.addEventListener("submit", e => {
      e.preventDefault();
      const formData = new FormData(form);
      fetch(scriptURL, { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
          if (data.result === "success") {
            alert("Pendaftaran berhasil!\nFile tersimpan di Google Drive.");
            form.reset();
          } else {
            alert("Terjadi kesalahan: " + data.message);
          }
        })
        .catch(err => alert("Gagal mengirim data: " + err));
    });
  </script>
</body>
</html>
