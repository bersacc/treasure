<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran BA</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #ffd700; }
    form {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    label { display: block; margin-top: 10px; font-weight: 500; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #ffd700;
      color: #111;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #msg { margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <h1>Formulir Pendaftaran BA</h1>
  <form id="regForm">
    <label>Nama Lengkap</label>
    <input type="text" name="nama" required>

    <label>Platform Promosi</label>
    <input type="text" name="platform" required>

    <label>Account BA</label>
    <input type="text" name="account" required>

    <label>Nomor WhatsApp</label>
    <input type="tel" name="whatsapp" required>

    <button type="submit">Kirim</button>
    <div id="msg"></div>
  </form>

  <script>
  const form = document.getElementById('regForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = 'Mengirim data...';

    const data = {
      nama: form.nama.value,
      platform: form.platform.value,
      account: form.account.value,
      whatsapp: form.whatsapp.value
    };

    try {
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const text = await res.text();
      console.log("Response:", text);

      let json;
      try {
        json = JSON.parse(text);
      } catch {
        json = { status: "error", message: "Respon tidak valid dari server." };
      }

      if (json.status === 'success') {
        msg.textContent = '✅ Data berhasil disimpan!';
        form.reset();
      } else {
        msg.textContent = '❌ ' + json.message;
      }
    } catch (err) {
      msg.textContent = '⚠️ Gagal mengirim: ' + err.message;
    }
  });
  </script>
</body>
</html>
