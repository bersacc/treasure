<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran Akun BA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: auto; padding: 20px; background-color: #f4f4f4; }
        h1 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="tel"], select, input[type="file"] {
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; box-sizing: border-box; border-radius: 4px;
        }
        #submit-btn {
            background-color: #007BFF; color: white; padding: 15px 20px; margin-top: 20px; border: none; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; transition: background-color 0.3s;
        }
        #submit-btn:hover:not([disabled]) { background-color: #0056b3; }
        #submit-btn[disabled] { background-color: #ccc; cursor: not-allowed; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .message { margin-top: 15px; padding: 15px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h1>Formulir Pendaftaran Akun BA</h1>
    
    <form id="registrationForm" method="POST" action="https://form-proxy.z5srnonfolkeg2g.workers.dev/">
        
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required>

        <label for="platform">Platform Promosi:</label>
        <select id="platform" name="platform" required>
            <option value="">-- Pilih Platform --</option>
            <option value="Twitter">Twitter</option>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
            <option value="Lainnya">Lainnya</option>
        </select>

        <label for="accountBA">Username Akun BA (tanpa @):</label>
        <input type="text" id="accountBA" name="usernameBA" required> 

        <label for="noWA">Nomor WhatsApp Aktif:</label>
        <input type="tel" id="noWA" name="noWA" placeholder="Contoh: 08123456789" required>

        <label for="screenshot">Screenshot Bukti Kepemilikan Account BA (JPG/PNG):</label>
        <input type="file" id="screenshot" name="screenshot" accept="image/png, image/jpeg" required>

        <button type="submit" id="submit-btn">Kirim Pendaftaran</button>
        <div id="message-container"></div>
    </form>

    <script>
        const form = document.getElementById('registrationForm');
        const submitButton = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');
        const workerUrl = form.action;

        // Fungsi konversi File menjadi Base64 String
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        const createSocialLink = (platform, username) => {
            if (!username) {
                return 'Username Kosong';
            }
            const cleanUsername = username.replace('@', '');
            switch (platform) {
                case 'Twitter':
                    return 'https://twitter.com/' + cleanUsername;
                case 'Instagram':
                    return 'https://instagram.com/' + cleanUsername;
                case 'TikTok':
                    return 'https://tiktok.com/@' + cleanUsername;
                case 'Lainnya':
                    return 'Platform Lain: ' + cleanUsername;
                default:
                    return 'Link Gagal';
            }
        };

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 

            submitButton.disabled = true;
            submitButton.textContent = 'Memproses... Harap Tunggu';
            messageContainer.innerHTML = ''; 

            const data = new FormData(form);
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];
            
            if (!file) {
                 messageContainer.innerHTML = '<div class="message error">❌ File bukti belum dipilih.</div>';
                 submitButton.disabled = false;
                 submitButton.textContent = 'Kirim Pendaftaran';
                 return;
            }

            let base64String = null;
            let mimeType = '';
            let fileName = '';

            try {
                // Konversi File ke Base64
                submitButton.textContent = 'Mengkonversi File (Base64)...';
                base64String = await toBase64(file);
                mimeType = file.type;
                fileName = file.name;
                
                // 1. Ambil data teks
                const platform = data.get('platform');
                const username = data.get('usernameBA');
                
                // 2. Buat objek data yang akan dikirim (JSON Payload)
                const payload = {
                    nama: data.get('nama'),
                    platform: platform,
                    usernameBA: username,
                    noWA: data.get('noWA'),
                    linkAkun: createSocialLink(platform, username), 
                    
                    // Data file Base64
                    base64File: base64String ? base64String.split(',')[1] : '', // Hapus header data URI
                    mimeType: mimeType,
                    fileName: fileName
                };

                submitButton.textContent = 'Mengirim Data...';
                
                // 3. Kirim data ke Worker menggunakan Fetch dengan body JSON
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // PENTING: Kirim sebagai JSON
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(`Worker merespons status ${response.status}: ${result.message || 'Error Server Tidak Diketahui'}`);
                }

                if (result.status === 'success') {
                    messageContainer.innerHTML = '<div class="message success">✅ Pendaftaran Berhasil! Data dan File Anda sudah tersimpan.</div>';
                    form.reset(); 
                } else {
                    messageContainer.innerHTML = `<div class="message error">❌ Pendaftaran Gagal (Apps Script Error): ${result.message}</div>`;
                }

            } catch (error) {
                messageContainer.innerHTML = `<div class="message error">🚨 Terjadi kesalahan koneksi atau server: ${error.message}</div>`;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Kirim Pendaftaran';
            }
        });
    </script>
</body>
</html>
