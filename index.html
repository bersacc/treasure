<!DOCTYPE html>
<html>
<head>
    <title>Formulir Pendaftaran Akun BA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: auto; padding: 20px; background-color: #f4f4f4; }
        h1 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="tel"], select, input[type="file"] {
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; box-sizing: border-box; border-radius: 4px;
        }
        #submit-btn {
            background-color: #007BFF; color: white; padding: 15px 20px; margin-top: 20px; border: none; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; transition: background-color 0.3s;
        }
        #submit-btn:hover:not([disabled]) { background-color: #0056b3; }
        #submit-btn[disabled] { background-color: #ccc; cursor: not-allowed; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .message { margin-top: 15px; padding: 15px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h1>Formulir Pendaftaran Akun BA</h1>
    
    <form id="registrationForm">
        
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" required>

        <label for="platform">Platform Promosi:</label>
        <select id="platform" name="platform" required>
            <option value="">-- Pilih Platform --</option>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
            <option value="YouTube">YouTube</option>
            <option value="Lainnya">Lainnya</option>
        </select>

        <label for="accountBA">Username Akun BA:</label>
        <input type="text" id="accountBA" name="accountBA" required>

        <label for="noWA">Nomor WhatsApp Aktif:</label>
        <input type="tel" id="noWA" name="noWA" placeholder="Contoh: 08123456789" required>

        <label for="screenshot">Screenshot Bukti Kepemilikan Account BA (JPG/PNG):</label>
        <input type="file" id="screenshot" name="screenshot" accept="image/png, image/jpeg" required>

        <button type="submit" id="submit-btn">Kirim Pendaftaran</button>
        <div id="message-container"></div>
    </form>

    <script>
        // URL Web App Skrip Mandiri Terbaru Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuZQ_jLy71SlCV-FI6L_4pTXI1VbRlTHskZxCwoc64t3pAA0Nd9L5iwBDgBhToH-S-/exec";

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const form = e.target;
            const submitButton = document.getElementById('submit-btn');
            const messageContainer = document.getElementById('message-container');
            
            submitButton.disabled = true;
            submitButton.textContent = 'Memproses... Harap Tunggu';
            messageContainer.innerHTML = ''; 

            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            if (!file) {
                alert('Mohon unggah file screenshot.');
                submitButton.disabled = false;
                submitButton.textContent = 'Kirim Pendaftaran';
                return;
            }
            
            // Batasan ukuran file (misalnya, 8MB) untuk mencegah timeout Apps Script
            const MAX_SIZE_MB = 8; 
            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                 messageContainer.innerHTML = `<div class="message error">Ukuran file melebihi ${MAX_SIZE_MB}MB. Harap gunakan file yang lebih kecil.</div>`;
                submitButton.disabled = false;
                submitButton.textContent = 'Kirim Pendaftaran';
                return;
            }

            // Gunakan FileReader untuk mengubah file menjadi Base64
            const reader = new FileReader();
            reader.readAsDataURL(file); 

            reader.onload = function() {
                // Base64 sudah memiliki header 'data:image/jpeg;base64,' yang akan diproses di Apps Script
                const base64DataWithHeader = reader.result;
                
                // Siapkan data untuk dikirim ke Apps Script
                const formData = {
                    nama: form.nama.value,
                    platform: form.platform.value,
                    accountBA: form.accountBA.value,
                    noWA: form.noWA.value,
                    screenshotBase64: base64DataWithHeader, // Kirim data Base64 utuh
                    screenshotName: file.name,
                    screenshotType: file.type 
                };

                // Kirim data menggunakan Fetch API
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => {
                    if (!response.ok) {
                        // Jika respons tidak OK (misalnya 500, 404), throw error
                        throw new Error('Network response was not ok, status: ' + response.status);
                    }
                    return response.json();
                })
                .then(result => {
                    if (result.status === 'success') {
                        messageContainer.innerHTML = '<div class="message success">✅ Pendaftaran Berhasil! Data Anda sudah tersimpan.</div>';
                        form.reset(); 
                    } else {
                        messageContainer.innerHTML = `<div class="message error">❌ Pendaftaran Gagal (Server Error): ${result.message}</div>`;
                    }
                })
                .catch(error => {
                    // Ini akan menangani error CORS atau kegagalan jaringan
                    messageContainer.innerHTML = `<div class="message error">🚨 Terjadi kesalahan jaringan atau server: ${error}</div>`;
                })
                .finally(() => {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Kirim Pendaftaran';
                });
            };

            reader.onerror = function(error) {
                messageContainer.innerHTML = `<div class="message error">Gagal membaca file: ${error}</div>`;
                submitButton.disabled = false;
                submitButton.textContent = 'Kirim Pendaftaran';
            };
        });
    </script>
</body>
</html>
